<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<!-- CSP estricta, la misma de MINSA Proyectos v0.160.0: sin scripts ni estilos en linea, Trusted Types con UNA politica
     (minsa-sw, la crea app.js para registrar el service worker). Las fuentes van vendorizadas en ./vendor/fuentes (OFL). -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self';
  img-src 'self' blob: data:;
  font-src 'self';
  connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://minsaenergy.sharepoint.com;
  frame-src https://login.microsoftonline.com;
  form-action 'none';
  base-uri 'none';
  object-src 'none';
  require-trusted-types-for 'script';
  trusted-types minsa-sw">
<title>MINSA ERP</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./iconos/icono-192.png">
<link rel="apple-touch-icon" href="./iconos/icono-192.png">
<link rel="stylesheet" href="./minsa-ui.css">
<link rel="stylesheet" href="./estilo.css">
</head>
<body>

<!-- ERP v0.3.0 (escrituras del kanban: dialogos al final) · v0.2.0 — fase 4, arranque: armazon (rail que colapsa a pestañas, tema claro/oscuro, ruta por hash), Inicio · Mis
     pendientes, Proyectos y el tablero de un proyecto (solo lectura). Archivos, Gastos y Equipo: «en construcción». -->
<section id="pantallaEntrar" class="entrar">
  <img class="logo solo-claro" src="./marca/lockup.svg" alt="MINSA ENERGY" width="724" height="256">
  <img class="logo solo-oscuro" src="./marca/lockup-oscuro.svg" alt="MINSA ENERGY" width="724" height="256">
  <div class="mn-card">
    <h1>ERP</h1>
    <p>Proyectos, pendientes, archivos y gastos, para todo el equipo.</p>
    <button id="btnEntrar" class="mn-btn is-primary is-block" type="button" disabled>Entrar con mi cuenta de MINSA</button>
    <p id="textoEntrar" class="pista" role="status" aria-live="polite">MINSA · ERP</p>
  </div>
</section>

<div id="pantallaSesion" class="mn-shell erp oculto">
  <nav class="mn-rail rail" aria-label="Principal">
    <div class="marca-rail"><img class="solo-claro" src="./marca/lockup.svg" alt="MINSA ENERGY" width="120" height="42"><img class="solo-oscuro" src="./marca/lockup-oscuro.svg" alt="MINSA ENERGY" width="120" height="42"><span class="nombre-app">ERP</span></div>
    <div id="destinos" class="destinos"></div>
    <div class="grp">Después</div>
    <button class="pronto" type="button" disabled>Planta CALYTEK<span class="soon">próximamente</span></button>
    <button class="pronto" type="button" disabled>Tablero<span class="soon">próximamente</span></button>
    <div class="pie-rail">
      <div><div id="quien" class="quien"></div><div id="rolQuien" class="lbl"></div></div>
      <div class="seg" role="group" aria-label="Tema"><button id="temaClaro" type="button">Claro</button><button id="temaOscuro" type="button">Oscuro</button></div>
      <button id="btnSalir" class="mn-btn" type="button">Salir</button>
      <p class="pie" id="pie"></p>
    </div>
  </nav>
  <main id="principal" class="principal">
    <header class="barra-movil">
      <img class="solo-claro" src="./marca/lockup.svg" alt="MINSA ENERGY" width="96" height="34"><img class="solo-oscuro" src="./marca/lockup-oscuro.svg" alt="MINSA ENERGY" width="96" height="34">
      <button id="temaMovil" class="mn-btn" type="button">Tema</button>
    </header>
    <div id="avisos" role="status" aria-live="polite"></div>
    <div id="vista" class="vista"></div>
  </main>
</div>

<!-- v0.3.0: las escrituras del kanban (tarjetas.js). Patron .mn-dialog de la piel; el boton de guardar dice QUE FALTA. -->
<dialog id="dlgNueva" class="mn-dialog dlg-erp" aria-labelledby="ntCab">
  <form id="formNueva" novalidate>
    <div class="mn-dialog-head"><div><h2 id="ntCab">Nueva tarea</h2><div id="ntProyecto" class="lbl"></div></div><button id="ntCerrar" class="mn-btn is-sm" type="button" aria-label="Cerrar">×</button></div>
    <div class="mn-dialog-body">
      <div class="dlg-avisos" role="status" aria-live="polite"></div>
      <div class="mn-field"><label for="ntTitulo">Título</label><input id="ntTitulo" maxlength="255" autocomplete="off" placeholder="Qué hay que hacer"></div>
      <div class="dos">
        <div class="mn-field"><label for="ntColumna">Cubeta</label><select id="ntColumna"></select></div>
        <div class="mn-field"><label for="ntPrioridad">Prioridad</label><select id="ntPrioridad"><option value="alta">Alta</option><option value="normal">Normal</option><option value="baja">Baja</option></select></div>
      </div>
      <div class="dos">
        <div class="mn-field"><label for="ntAsignado">Asignado</label><select id="ntAsignado"></select></div>
        <div class="mn-field"><label for="ntVence">Vence</label><input id="ntVence"></div>
      </div>
      <div class="mn-field"><label for="ntDesc">Descripción</label><textarea id="ntDesc" rows="3" placeholder="Opcional"></textarea></div>
    </div>
    <div class="mn-dialog-foot"><button id="ntCancelar" class="mn-btn" type="button">Cancelar</button><button id="ntGuardar" class="mn-btn" type="submit" disabled>Falta el título</button></div>
  </form>
</dialog>

<dialog id="dlgFicha" class="mn-dialog dlg-erp" aria-labelledby="fCab">
  <form id="formFicha" novalidate>
    <div class="mn-dialog-head"><div class="ficha-cab"><h2 id="fCab"></h2><div id="fDonde" class="lbl"></div></div><button id="fCerrar" class="mn-btn is-sm" type="button" aria-label="Cerrar">×</button></div>
    <div class="mn-dialog-body">
      <div class="dlg-avisos" role="status" aria-live="polite"></div>
      <p id="fSoloLectura" class="nota-lectura oculto"></p>
      <div class="mn-field"><label for="fTitulo">Título</label><input id="fTitulo" maxlength="255" autocomplete="off"></div>
      <div class="dos">
        <div class="mn-field"><label for="fAsignado">Asignado</label><select id="fAsignado"></select></div>
        <div class="mn-field"><label for="fPrioridad">Prioridad</label><select id="fPrioridad"><option value="alta">Alta</option><option value="normal">Normal</option><option value="baja">Baja</option></select></div>
      </div>
      <div class="mn-field"><label for="fVence">Vence</label><input id="fVence"></div>
      <div id="fMoverCaja" class="mover-caja"><div class="lbl">Mover a</div><div id="fMover" class="mover" role="group" aria-label="Mover a otra cubeta"></div></div>
    </div>
    <div class="mn-dialog-foot"><button id="fBorrar" class="mn-btn borrar oculto" type="button">Borrar tarjeta</button><button id="fGuardar" class="mn-btn" type="submit" disabled>Sin cambios</button></div>
  </form>
</dialog>

<script src="./vendor/msal-browser.min.js" integrity="sha256-px+JPcPJ+jxZIZ4FNatqAKYoGGDyQxWrgRgwS6r6zGQ="></script>
<script type="module" src="./app.js"></script>
</body>
</html>
